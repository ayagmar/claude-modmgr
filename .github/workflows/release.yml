name: release

# A release (PLAN §9): `claude plugin tag plugin` makes a `modmgr--v<version>` tag
# once plugin.json and the marketplace entry agree; pushing it runs this, which
# runs the gate again and publishes the CHANGELOG's section as the release.
on:
  push:
    tags: ['modmgr--v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLAUDE_CODE_VERSION: 2.1.293
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      DISABLE_AUTOUPDATER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - run: echo "CLAUDE_CONFIG_DIR=$(mktemp -d)" >> "$GITHUB_ENV"
      - run: pnpm gate
      - name: The CHANGELOG's section for this version
        run: |
          version="${GITHUB_REF_NAME#modmgr--v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "modmgr ${GITHUB_REF_NAME#modmgr--v}" --notes-file notes.md
