name: index

# The hosted indexes, read from raw.githubusercontent.com: v1.json classifies
# every remote entry of the official catalogues (mod, command hooks, plain) at
# its pinned commit; mods-v2.json lists every mod found across public GitHub
# with what `claude plugin validate` reports for each, and mods-v1.json the
# most-starred of them that modmgr 0.4.0 and older read whole. Discover knows them after
# a request each. Built daily and force-pushed as the single commit of the
# `catalog-index` branch. Run it by hand once a new repository has it, so the
# indexes exist before anyone installs.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

# Nothing by default: each job asks for what it needs.
permissions: {}

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  # Runs the CLI, fetches hundreds of files from catalogue repositories, and
  # clones and validates every candidate mod repository (no mod code runs): its
  # token can read and search public GitHub, and nothing more.
  build:
    if: github.repository == 'ayagmar/claude-modmgr'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      mods: ${{ steps.mods.outcome }}
    env:
      CLAUDE_CODE_VERSION: 2.1.296
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      DISABLE_AUTOUPDATER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      # It reads the catalogues on a throwaway config and refuses to write a
      # file when much was left unclassified or a client would refuse it.
      # The repositories of the mods it found go to the community build, not out.
      - run: |
          mkdir "$RUNNER_TEMP/out"
          node scripts/build-index.ts "$RUNNER_TEMP/out/v1.json" "$RUNNER_TEMP/mod-repos.txt"
      # A refused, failed or timed-out community build keeps the published file
      # (see publish); its own timeout leaves the job time to upload v1.json.
      - id: mods
        continue-on-error: true
        timeout-minutes: 70
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build-mods.ts "$RUNNER_TEMP/out/mods-v2.json" "$RUNNER_TEMP/mod-repos.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-index
          path: ${{ runner.temp }}/out/
          retention-days: 1

  # Holds the write token and runs no third-party code: it only pushes the files.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: catalog-index
          path: ${{ runner.temp }}/publish
      - name: Publish to the catalog-index branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/publish"
          test -s v1.json
          git init -q -b catalog-index
          # No fresh community index: the published files stay, taken from the
          # branch itself. A failed fetch stops here rather than publish without them.
          if [ ! -s mods-v2.json ]; then
            remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            if git ls-remote --exit-code --heads "$remote" catalog-index >/dev/null; then
              git fetch -q --depth 1 "$remote" catalog-index
              for file in mods-v1.json mods-v2.json; do
                if git cat-file -e "FETCH_HEAD:$file" 2>/dev/null; then
                  git show "FETCH_HEAD:$file" > "$file"
                fi
              done
            elif [ $? -ne 2 ]; then
              echo "::error::couldn't read the catalog-index branch"
              exit 1
            fi
          fi
          git add v1.json
          for file in mods-v1.json mods-v2.json; do
            if [ -s "$file" ]; then git add "$file"; fi
          done
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "chore: catalogue index $(date -u +%F)"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" catalog-index
      - name: Fail when the community index wasn't rebuilt
        if: needs.build.outputs.mods != 'success'
        run: |
          echo "::error::the community index build failed or was refused; the last one stays published"
          exit 1
