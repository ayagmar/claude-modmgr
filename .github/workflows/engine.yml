name: engine

# The newest Claude Code against modmgr, weekly: CI checks the pinned build,
# so this is what says a new release broke the plugin before people update to
# it. A failure here means moving the pin (scripts/update-types.sh) and fixing
# what the new build refuses.
on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
  DISABLE_AUTOUPDATER: '1'

jobs:
  latest:
    if: github.repository == 'ayagmar/claude-modmgr'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dev tooling
        run: pnpm install --frozen-lockfile

      - name: Install the newest Claude Code
        run: |
          npm install --global "@anthropic-ai/claude-code@latest"
          echo "::notice::Claude Code $(claude --version)"

      # The declarations the new build lays, in place of the pinned ones (this checkout only).
      - name: Type-check the plugin against its declarations
        run: |
          scripts/update-types.sh
          version="$(claude --version | cut -d' ' -f1)"
          sed -i "s#claude-code-types/[0-9.]*/#claude-code-types/$version/#" plugin/tsconfig.json
          pnpm tsc -p plugin --noEmit

      # Every CLI call below runs against a throwaway config dir.
      - name: Isolate the Claude Code config
        run: echo "CLAUDE_CONFIG_DIR=$(mktemp -d)" >> "$GITHUB_ENV"

      - name: Validate the plugin (strict, with modmgr's expected verdicts)
        run: node scripts/validate-plugin.ts

      - name: Plugin tests (wiring, dispatch rules and UI)
        run: node scripts/test-plugin.ts
