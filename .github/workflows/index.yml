name: index

# The hosted catalogue index: every remote entry of the official catalogues
# classified (mod, command hooks, plain) at its pinned commit, so modmgr's
# Discover knows their mods after one request. Built daily and force-pushed as
# the single commit of the `catalog-index` branch, read from
# raw.githubusercontent.com.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

# Nothing by default: each job asks for what it needs.
permissions: {}

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  # Runs the CLI and fetches hundreds of files from catalogue repositories: it
  # can read this repository and nothing more.
  build:
    if: github.repository == 'ayagmar/modmgr'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CLAUDE_CODE_VERSION: 2.1.293
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      DISABLE_AUTOUPDATER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      # It reads the catalogues on a throwaway config and refuses to write a
      # file when much was left unclassified or a client would refuse it.
      - run: node scripts/build-index.ts "$RUNNER_TEMP/v1.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-index
          path: ${{ runner.temp }}/v1.json
          retention-days: 1

  # Holds the write token and runs no third-party code: it only pushes the file.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: catalog-index
          path: ${{ runner.temp }}/publish
      - name: Publish to the catalog-index branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/publish"
          test -s v1.json
          git init -q -b catalog-index
          git add v1.json
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "chore: catalogue index $(date -u +%F)"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" catalog-index
