name: release

# A release: `claude plugin tag plugin` makes a `modmgr--v<version>` tag from
# plugin.json's version; pushing it runs this, which runs the gate again and
# publishes the CHANGELOG's section as the release.
on:
  push:
    tags: ['modmgr--v*']

# Nothing by default: each job asks for what it needs.
permissions: {}

jobs:
  # Runs the dependencies and the gate: it can only read.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CLAUDE_CODE_VERSION: 2.1.296
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      DISABLE_AUTOUPDATER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag names plugin.json's version
        run: |
          version="$(jq -r .version plugin/.claude-plugin/plugin.json)"
          test "$GITHUB_REF_NAME" = "modmgr--v$version" ||
            { echo "::error::tag $GITHUB_REF_NAME, but plugin.json says $version"; exit 1; }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - run: echo "CLAUDE_CONFIG_DIR=$(mktemp -d)" >> "$GITHUB_ENV"
      - run: pnpm gate

  # Holds the write token and runs no third-party code: it only creates the release.
  release:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The CHANGELOG's section for this version
        run: |
          version="${GITHUB_REF_NAME#modmgr--v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "modmgr ${GITHUB_REF_NAME#modmgr--v}" --notes-file notes.md
